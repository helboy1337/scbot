# Triggert wanneer een issue label `auto-agent` heeft (zoals de Discord-bot aanmaakt).
# Secret: CURSOR_API_KEY — curl naar Cursor API zie https://cursor.com/docs/background-agent/api/overview

name: Cursor background agent

on:
  issues:
    types: [opened, labeled]

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Controleren op label auto-agent
        id: check
        env:
          LABELS_JSON: ${{ toJson(github.event.issue.labels) }}
        run: |
          if echo "$LABELS_JSON" | jq -e 'any(.name == "auto-agent")' >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.action }}" = "labeled" ] && [ "${{ github.event.label.name }}" = "auto-agent" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  trigger-agent:
    needs: should-run
    if: needs.should-run.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Eénmalige issue-comment (auto-agent)
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- scbot-auto-agent -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some((c) => (c.body || "").includes(marker))) {
              core.notice("Auto-agent comment bestaat al; overslaan.");
              return;
            }
            const body = [
              marker,
              "",
              "**Auto-agent workflow** is gestart (label `auto-agent`).",
              "",
              "- Secret op GitHub moet **exact** **`CURSOR_API_KEY`** heten (hoofdletters + liggende streepjes) — niet `key` of `cursor`. Waarde = alleen de key, zonder aanhalingstekens.",
              "- Zonder geldige key faalt de volgende stap; zie **Actions** logs.",
            ].join("\n");
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Cursor Cloud Agent — POST /v0/agents
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPO_CLONE_URL: ${{ github.event.repository.clone_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "::error::Secret ontbreekt of heet verkeerd. Maak **Repository secret** met naam exact: CURSOR_API_KEY (zie Cursor Cloud Agents / dashboard)."
            exit 1
          fi
          REF="${DEFAULT_BRANCH:-main}"
          PROMPT_TEXT=$(printf '%s\n\n%s\n\n%s' "GitHub issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" "${ISSUE_BODY:-_(geen body)_}" "${ISSUE_URL}")
          BODY=$(jq -n \
            --arg text "$PROMPT_TEXT" \
            --arg repo "$REPO_CLONE_URL" \
            --arg ref "$REF" \
            '{prompt: {text: $text}, source: {repository: $repo, ref: $ref}}')
          echo "Roep Cursor Cloud Agents API aan…"
          HTTP=$(curl -sS -o /tmp/cursor_agent.json -w "%{http_code}" \
            -X POST "https://api.cursor.com/v0/agents" \
            -H "Authorization: Bearer ${CURSOR_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "HTTP status: ${HTTP}"
          head -c 4000 /tmp/cursor_agent.json || true
          echo
          case "$HTTP" in 200|201|202) ;; *) echo "::error::Cursor API gaf geen success ($HTTP). Controleer key (Cloud Agents) en API-rechten."; exit 1 ;; esac
