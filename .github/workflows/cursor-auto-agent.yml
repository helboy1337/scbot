# Triggert wanneer een issue label `auto-agent` heeft (zoals de Discord-bot aanmaakt).
# Secret: CURSOR_API_KEY — curl naar Cursor API zie https://cursor.com/docs/background-agent/api/overview

name: Cursor background agent

on:
  issues:
    types: [opened, labeled]

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Controleren op label auto-agent
        id: check
        env:
          LABELS_JSON: ${{ toJson(github.event.issue.labels) }}
        run: |
          if echo "$LABELS_JSON" | jq -e 'any(.name == "auto-agent")' >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.action }}" = "labeled" ] && [ "${{ github.event.label.name }}" = "auto-agent" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  trigger-agent:
    needs: should-run
    if: needs.should-run.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Eénmalige issue-comment (auto-agent)
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- scbot-auto-agent -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some((c) => (c.body || "").includes(marker))) {
              core.notice("Auto-agent comment bestaat al; overslaan.");
              return;
            }
            const body = [
              marker,
              "",
              "**Auto-agent workflow** is gestart (label `auto-agent`).",
              "",
              "- Zet repo secret **`CURSOR_API_KEY`** in *Settings → Secrets and variables → Actions* om een Cursor Background Agent te kunnen aanroepen (zie [Cursor docs](https://cursor.com/docs/background-agent/api/overview)).",
              "- Zonder die secret gebeurt er verder alleen dit bericht; het issue blijft voor handmatige triage.",
            ].join("\n");
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Optioneel — Cursor Background Agent API
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "::notice::CURSOR_API_KEY ontbreekt — geen API-call."
            exit 0
          fi
          echo "Voeg hier indien gewenst curl naar de Cursor Background Agent API toe."
